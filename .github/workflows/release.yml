name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            archive: kubectl-multi-get_darwin_amd64.tar.gz
          - goos: darwin
            goarch: arm64
            archive: kubectl-multi-get_darwin_arm64.tar.gz
          - goos: linux
            goarch: amd64
            archive: kubectl-multi-get_linux_amd64.tar.gz
          - goos: linux
            goarch: arm64
            archive: kubectl-multi-get_linux_arm64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/kubectl-multi-get ./cmd/kubectl-multi-get
          tar -czf "dist/${{ matrix.archive }}" -C dist kubectl-multi-get -C "$GITHUB_WORKSPACE" LICENSE
          rm dist/kubectl-multi-get

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release assets
        run: |
          cp install.sh dist/install.sh
          chmod +x dist/install.sh
          sha256sum dist/*.tar.gz | sed 's#dist/##' > dist/checksums.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt dist/install.sh --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt dist/install.sh --title "$GITHUB_REF_NAME" --generate-notes
          fi
